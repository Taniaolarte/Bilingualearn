<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BilinguaLearn · Pago cancelado</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%236366f1'>🐨</text></svg>"/>
  <style>
  :root{
    --bg:#f4f3fe; --bg2:#eceafc; --surface:#ffffff; --surface2:#faf9ff;
    --ink:#221d47; --muted:#6c6790; --line:#e6e2f7;
    --primary:#7c6ff0; --primary-d:#6357cf; --deep:#5b52b8; --deep2:#463f97;
    --accent:#ef8fbb; --accent-ink:#c04d80; --gold:#f2b757; --good:#57b98d; --good-d:#2a8a62; --good-bg:#e8f7ef; --good-line:#bfe6d2;
    --halo:rgba(124,111,240,.16); --shadow:0 22px 48px -26px rgba(70,55,150,.55);
    --shadow-sm:0 12px 26px -16px rgba(70,55,150,.5);
    --radius:26px; --maxw:1120px;
    --sans:ui-rounded,'SF Pro Rounded','Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);line-height:1.6;
    background:
      radial-gradient(60% 45% at 82% -6%,var(--halo),transparent 60%),
      radial-gradient(46% 40% at 8% 8%,var(--halo),transparent 60%),
      linear-gradient(var(--bg),var(--bg2));
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
  section{padding:74px 0}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--primary-d);background:var(--halo);
    padding:7px 14px;border-radius:999px;margin:0 0 16px;
  }
  h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance;font-weight:850}
  h1{font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.04}
  h2{font-size:clamp(1.7rem,3.6vw,2.55rem);line-height:1.08}
  h3{font-size:1.18rem}
  p{margin:0}
  .lead{font-size:clamp(1.05rem,1.6vw,1.22rem);color:var(--muted)}
  .center{text-align:center}
  .sec-head{max-width:660px;margin:0 auto 44px}
  .sec-head.center{text-align:center}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
    font-weight:800;font-size:1rem;padding:14px 24px;border-radius:999px;
    border:1px solid transparent;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease,background .2s;white-space:nowrap}
  .btn:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  .btn-wa{background:#25d366;color:#08351a;box-shadow:0 14px 26px -12px rgba(37,211,102,.7)}
  .btn-wa:hover{transform:translateY(-2px);box-shadow:0 20px 34px -12px rgba(37,211,102,.75)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
  .btn-primary:hover{transform:translateY(-2px);background:var(--primary-d)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary-d)}
  .btn-light{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.34)}
  .btn-light:hover{background:rgba(255,255,255,.24)}
  .wa-ico{width:19px;height:19px;flex:none}

  /* nav */
  header.nav{position:sticky;top:0;z-index:60;
    backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);
    border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;gap:16px;height:68px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.16rem;letter-spacing:-.02em;flex:0 1 auto;min-width:0;white-space:nowrap}
  .brand img{width:38px;height:38px;border-radius:11px;background:var(--halo);flex:none}
  .brand b{color:var(--primary-d)}
  .nav-links{display:flex;gap:26px;margin-left:14px}
  .nav-links a{font-weight:650;color:var(--muted);font-size:.95rem}
  .nav-links a:hover{color:var(--ink)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
  .toggle{display:inline-flex;flex:none;background:var(--halo);border-radius:999px;padding:4px;font-weight:800;font-size:.82rem}
  .toggle button{border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:800;font-family:inherit}
  .toggle button.on{background:var(--surface);color:var(--primary-d);box-shadow:var(--shadow-sm)}
  .nav .btn{padding:11px 18px;font-size:.92rem}

  /* hero */
  .hero{padding-top:52px}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
  .hero h1 .hl{color:var(--primary-d);position:relative}
  .hero .lead{margin-top:18px;max-width:34ch}
  .hero-cta{display:flex;flex-wrap:wrap;gap:13px;margin-top:26px}
  .hero-art{position:relative;display:grid;place-items:center;min-height:360px}
  .blob{position:absolute;inset:6% 4%;
    background:radial-gradient(circle at 40% 35%,#b7aef8,var(--primary) 55%,var(--deep));
    border-radius:44% 56% 58% 42%/52% 44% 56% 48%;filter:blur(2px);opacity:.9;
    animation:morph 14s ease-in-out infinite}
  .hero-art img.koala{position:relative;width:min(88%,420px);filter:drop-shadow(0 26px 30px rgba(70,55,150,.4));animation:floaty 5s ease-in-out infinite}
  .chip{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:10px 14px;box-shadow:var(--shadow);font-weight:800;font-size:.86rem;display:flex;align-items:center;gap:9px}
  .chip small{display:block;font-weight:650;color:var(--muted);font-size:.72rem}
  .chip.c1{top:8%;left:-2%}
  .chip.c3{bottom:32%;left:-4%;background:var(--primary);color:#fff;border-color:transparent}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes morph{0%,100%{border-radius:44% 56% 58% 42%/52% 44% 56% 48%}50%{border-radius:58% 42% 44% 56%/46% 58% 42% 54%}}

  /* trust bar */
  .trust{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .trust-in{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:26px 0}
  .trust-label{font-weight:850;line-height:1.25;max-width:170px}
  .trust-label span{color:var(--primary-d)}
  .badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .badge{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:11px 13px;min-width:0}
  .badge .b-ic{width:32px;height:32px;border-radius:9px;background:var(--halo);color:var(--primary-d);display:grid;place-items:center;font-weight:900;flex:none}
  .badge b{display:block;font-size:.88rem;line-height:1.2}
  .badge small{color:var(--muted);font-size:.72rem;line-height:1.3}

  /* generic card grid */
  .grid{display:grid;gap:20px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-sm)}
  .card.hoverable{transition:transform .18s ease,box-shadow .2s ease}
  .card.hoverable:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .card .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:16px;background:var(--halo)}
  .card .ic img{width:52px;height:52px}
  .card h3{margin-bottom:8px}
  .card p{color:var(--muted);font-size:.96rem}

  /* about + meet aura split */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
  .aura-card{position:relative;background:linear-gradient(150deg,var(--primary),var(--deep));border-radius:32px;padding:34px;color:#fff;box-shadow:var(--shadow);overflow:hidden}
  .aura-card::after{content:"";position:absolute;width:230px;height:230px;right:-60px;top:-70px;border-radius:50%;background:rgba(255,255,255,.12)}
  .aura-card img{width:min(78%,300px);margin:6px auto 0;position:relative;animation:floaty 6s ease-in-out infinite}
  /* coach photo frame */
  .coach-photo{position:relative;width:min(100%,420px);margin:0 auto}
  .coach-photo .frame{border-radius:30px;overflow:hidden;border:6px solid var(--surface);box-shadow:var(--shadow);background:var(--halo)}
  .coach-photo .frame img{width:100%;display:block;animation:none}
  .coach-photo .halo-bg{position:absolute;inset:-14px -14px auto auto;width:64%;height:78%;z-index:-1;border-radius:38% 42% 46% 40%/44% 48% 40% 46%;background:linear-gradient(150deg,var(--primary),var(--deep));opacity:.9}
  .coach-badge{position:absolute;left:-14px;bottom:-14px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
  .coach-badge img{width:38px;height:38px;border-radius:10px;background:var(--halo)}
  .coach-badge b{display:block;font-size:.82rem}
  .coach-badge small{color:var(--muted);font-size:.72rem}
  .coach-creds{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .coach-creds span{font-size:.8rem;font-weight:800;color:var(--primary-d);background:var(--halo);padding:7px 12px;border-radius:999px}
  .pullquote{margin:22px 0 0;padding:16px 20px;border-left:4px solid var(--primary);background:var(--halo);border-radius:0 14px 14px 0;font-weight:750;font-size:1.06rem;line-height:1.45;color:var(--ink)}
  .story{margin-top:18px}
  .story summary{color:var(--primary-d);font-size:.95rem}
  .story p{color:var(--muted);font-size:.95rem;padding:0}
  .story p+p{margin-top:12px}
  .story .body{padding-bottom:20px}
  .speech{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
  .speech li{display:flex;gap:12px;align-items:flex-start;color:var(--muted)}
  .speech .dot{width:26px;height:26px;border-radius:8px;background:var(--halo);color:var(--primary-d);display:grid;place-items:center;font-weight:900;flex:none;font-size:.9rem}

  /* methodology steps */
  .steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;position:relative}
  .step .n{counter-increment:s;width:44px;height:44px;border-radius:13px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.2rem;margin-bottom:16px;box-shadow:var(--shadow-sm)}
  .step .n::before{content:counter(s,decimal-leading-zero)}
  .step h3{font-size:1.05rem;margin-bottom:6px}
  .step p{color:var(--muted);font-size:.92rem}

  /* packages */
  .pkg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .pkg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;text-align:center;transition:transform .18s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column}
  .pkg:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--primary)}
  .pkg.featured{border-color:var(--primary);box-shadow:var(--shadow)}
  .pkg .tag{font-size:.72rem;font-weight:850;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-ink);min-height:16px;display:block;margin-bottom:6px}
  .pkg .hrs{font-size:2.6rem;font-weight:900;color:var(--primary-d);line-height:1;font-variant-numeric:tabular-nums}
  .pkg .unit{font-size:.95rem;color:var(--muted);font-weight:700}
  .pkg .for{display:inline-block;align-self:center;margin-top:12px;padding:4px 10px;border-radius:999px;background:var(--bg,#f4f5fa);border:1px solid var(--line);font-size:.72rem;font-weight:800;color:var(--primary-d);letter-spacing:.02em}
  .pkg .price{margin-top:14px;font-size:1.72rem;font-weight:900;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
  .pkg .price .cur{font-size:.95rem;font-weight:800;color:var(--muted)}
  .pkg .desc{font-size:.86rem;color:var(--muted);margin:12px 0 18px;min-height:38px}
  .pkg .desc:last-of-type{margin-bottom:auto;padding-bottom:18px}
  .pkg .btn{width:100%;font-size:.9rem;padding:11px}
  /* two clearly separated groups: exam prep (lavender) vs general English (green) */
  .pkg-group{border-radius:calc(var(--radius) + 6px);padding:22px 22px 24px;border:2px solid var(--line);background:var(--surface2)}
  .pkg-group+.pkg-group{margin-top:26px}
  .pkg-group-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
  .pkg-group-head h3{font-size:1.25rem;margin:0}
  .pkg-group-head .note{flex-basis:100%;margin:0;color:var(--muted);font-size:.92rem}
  .grp{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
  .pkg-grid.two{grid-template-columns:repeat(2,1fr);max-width:640px;margin:0 auto}
  .pkg-grid.three{grid-template-columns:repeat(3,1fr)}
  .pkg .hrs.txt{font-size:1.55rem;line-height:1.15;padding-top:6px}
  .pkg .tagline{font-size:.95rem;font-weight:800;color:var(--ink);margin:12px 0 0}
  .pkg .price-note{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:4px}
  .pkg .desc{text-align:left}
  .addon-head{margin:26px 0 12px;text-align:center;font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-d)}
  .pkg-group.exam{border-color:var(--primary);background:linear-gradient(180deg,var(--bg2),var(--surface2))}
  .pkg-group.exam .grp{background:var(--primary);color:#fff}
  .pkg-group.exam .pkg{border-top:6px solid var(--primary)}
  .pkg-group.general{border-color:var(--good);background:linear-gradient(180deg,var(--good-bg),var(--surface2))}
  .pkg-group.general .grp{background:var(--good-d);color:#fff}
  .pkg-group.general .pkg{border-top:6px solid var(--good)}
  .pkg-group.general .pkg:hover,.pkg-group.general .pkg.featured{border-color:var(--good);border-top-color:var(--good)}
  .pkg-group.general .pkg .hrs{color:var(--good-d)}
  .pkg-group.general .pkg .for{background:var(--good-bg);border-color:var(--good-line);color:var(--good-d)}
  .pkg-group.general .pkg .btn-primary{background:var(--good-d)}
  .pkg-group.general .pkg .btn-primary:hover{background:#22704f}
  .pkg-group.general .pkg .btn-ghost:hover{border-color:var(--good-d);color:var(--good-d)}
  .pkg .warn{display:flex;align-items:flex-start;gap:6px;text-align:left;margin:0 0 14px;padding:8px 10px;border-radius:12px;background:#fff1f6;border:1px solid #f7c6da;color:var(--accent-ink);font-size:.78rem;font-weight:800;line-height:1.3}
  .pkg .warn::before{content:"⚠";flex:none}

  /* results */
  .results{background:var(--surface);border-radius:34px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
  .results-grid{display:grid;grid-template-columns:.85fr 1.15fr}
  .case-side{background:linear-gradient(160deg,var(--accent),#d96aa0);color:#fff;padding:40px 34px;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .scorebar{display:flex;align-items:center;gap:14px}
  .score{background:rgba(255,255,255,.16);border-radius:18px;padding:14px 20px;text-align:center;flex:1}
  .score .v{font-size:2.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .score .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;opacity:.9}
  .arrow{font-size:1.8rem;font-weight:900;opacity:.9}
  .quote-side{padding:40px 34px;display:grid;gap:16px;align-content:center}
  .stars{color:var(--gold);font-size:1.15rem;letter-spacing:2px}
  .quote-side blockquote{margin:0;font-size:1.18rem;font-weight:650;line-height:1.5}
  .qmeta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.9rem;font-weight:700}
  .qmeta img{width:44px;height:44px;border-radius:12px;background:var(--halo)}
  .rev-carousel{position:relative}
  .rev-grid{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scroll-behavior:smooth;
            padding:4px 2px 8px;scrollbar-width:none;-ms-overflow-style:none}
  .rev-grid::-webkit-scrollbar{display:none}
  .rev-grid:empty{display:none}
  .rev{flex:0 0 336px;scroll-snap-align:start;display:flex;flex-direction:column;margin:0;
       background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px}
  .rev .stars{color:var(--gold);letter-spacing:.1em;font-size:1.05rem}
  .rev blockquote{margin:12px 0 0;font-size:.94rem;line-height:1.6;color:var(--ink)}
  .rev blockquote p{margin:0}
  .rev blockquote p+p{margin-top:10px}
  .rev .body{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
  .rev.open .body{display:block;overflow:visible}
  .rev .more{align-self:flex-start;margin-top:8px;border:0;background:none;padding:0;cursor:pointer;
             font:inherit;font-size:.84rem;font-weight:800;color:var(--primary-d);text-decoration:underline}
  .rev .who{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:11px}
  .rev .who .av{width:36px;height:36px;border-radius:50%;background:var(--halo);color:var(--primary-d);display:grid;place-items:center;font-weight:900;flex:none}
  .rev .who b{font-size:.9rem;display:block}
  .rev .who small{color:var(--muted);font-size:.78rem}
  .rev-nav{display:flex;justify-content:center;gap:10px;margin-top:16px}
  .rev-nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
                  color:var(--primary-d);font-size:1.1rem;font-weight:900;cursor:pointer;display:grid;place-items:center;
                  transition:background .15s,border-color .15s,opacity .15s}
  .rev-nav button:hover:not(:disabled){background:var(--halo);border-color:var(--primary)}
  .rev-nav button:disabled{opacity:.35;cursor:default}
  .rev-cta{margin-top:26px;background:linear-gradient(150deg,var(--deep),var(--deep2));color:#fff;border-radius:34px;padding:38px;text-align:center;box-shadow:var(--shadow)}
  .rev-cta p{color:rgba(255,255,255,.84);margin:14px 0 22px}
  .rev-score .v{font-size:2.4rem;font-weight:900;line-height:1;color:var(--gold)}
  .rev-score .l{font-size:.82rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:6px}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
  .stat{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 14px}
  .stat .v{font-size:2rem;font-weight:900;color:var(--primary-d);font-variant-numeric:tabular-nums}
  .stat .l{color:var(--muted);font-size:.88rem;font-weight:650}

  /* qa band */

  /* faq */
  .faq{max-width:820px;margin:0 auto;display:grid;gap:12px}
  details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 22px;transition:border-color .2s}
  details[open]{border-color:var(--primary)}
  summary{cursor:pointer;font-weight:800;padding:18px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px}
  summary::-webkit-details-marker{display:none}
  summary .plus{width:26px;height:26px;border-radius:8px;background:var(--halo);color:var(--primary-d);display:grid;place-items:center;font-weight:900;flex:none;transition:transform .2s}
  details[open] summary .plus{transform:rotate(45deg)}
  details p{color:var(--muted);padding:0 0 20px}

  /* final cta */
  .final{background:linear-gradient(150deg,var(--primary),var(--deep));color:#fff;border-radius:36px;padding:56px 44px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
  /* m-grad.png bakes CELPIP/IELTS/PTE labels at y62-85 and y435-454, which
     read as dirt on the purple panel. Crop to the koala itself: the 300px
     square at (105,95) of the 512px artwork. The float runs on the frame so
     the motion can never uncover a label. */
  .final .koala-crop{position:relative;width:min(280px,64vw);aspect-ratio:1;margin:0 auto 20px;
                     overflow:hidden;animation:floaty 5s ease-in-out infinite}
  .final img.koala{position:absolute;width:170.7%;max-width:none;left:-35%;top:-31.7%;margin:0}
  .final h2{color:#fff;max-width:16ch;margin:0 auto}
  .final p{color:rgba(255,255,255,.85);margin:14px auto 0;max-width:52ch}
  .final .hero-cta{justify-content:center}

  /* footer */
  footer.site{padding:56px 0 40px;border-top:1px solid var(--line);margin-top:20px}
  .foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px;align-items:start}
